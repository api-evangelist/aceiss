name: Aceiss
description: >-
  Aceiss is a security monitoring and access-visibility platform that gives
  CISOs and risk managers continuous insight into who has access to their GitHub
  organizations and repositories. It monitors user access across repositories,
  detects unauthorized or anomalous activity in real time, and produces
  governance and compliance reporting mapped to frameworks such as NIST, CIS,
  HIPAA, ISO 27001, CSA STAR, HITRUST, and SOC 2. Aceiss installs from the
  GitHub Marketplace as a read-only app requiring admin privileges and exposes
  an API for integrating its real-time access data into existing systems, with
  spreadsheet and PDF export. The company is backed by Canaan Partners.
